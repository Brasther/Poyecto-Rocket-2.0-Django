{% extends "base.html" %}
{% block title %}Crear cuenta · Rocket Tracking{% endblock %}
{% block body %}
<section class="container py-5" style="max-width: 34rem;">
    <h1 class="h2 mb-3">Crear cuenta</h1>
    <p class="text-secondary">Regístrate para crear y administrar tus envíos de demostración.</p>
    <form method="post" action="{% url 'signup' %}" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Crear cuenta</button>
    </form>
</section>
{% endblock %}
