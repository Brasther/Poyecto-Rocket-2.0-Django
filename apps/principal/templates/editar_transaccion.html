{% extends "base.html" %}
{% block title %}Editar envío · Rocket Tracking{% endblock %}
{% block body %}
<section class="container py-5" style="max-width: 50rem;">
    <h1 class="h2">Editar datos del envío</h1>
    <p class="text-secondary">Código de seguimiento: <code>{{ transaccion.codigo_seguimiento }}</code></p>
    <form method="post" action="{% url 'editar_transaccion' transaccion_id=transaccion.ID %}" class="card card-body">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar cambios</button>
            <a class="btn btn-outline-secondary" href="{% url 'mis_transacciones' %}">Volver a mis envíos</a>
        </div>
    </form>
</section>
{% endblock %}
