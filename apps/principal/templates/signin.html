{% extends "base.html" %}
{% block title %}Iniciar sesión · Rocket Tracking{% endblock %}
{% block body %}
<section class="container py-5" style="max-width: 34rem;">
    <h1 class="h2 mb-3">Iniciar sesión</h1>
    <p class="text-secondary">Accede para crear y consultar tus envíos.</p>
    <form method="post" action="{% url 'signin' %}" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
    </form>
</section>
{% endblock %}
